  <script>
    (function () {
      'use strict';

      var Cart = window.SteroidCart;
      if (!Cart) {
        document.getElementById('sc-cart-content').innerHTML =
          '<div class="sc-cart-empty">Fehler: Cart-System nicht geladen.</div>';
        return;
      }

      function formatPrice(amount) {
        return String(amount.toFixed(2)).replace('.', ',') + ' €';
      }

      function renderCart() {
        var cart = Cart.getCart();
        var container = document.getElementById('sc-cart-content');
        var count = Cart.getCount();

        if (count === 0) {
          container.innerHTML =
            '<div class="sc-cart-empty">' +
            '  <i class="fa fa-shopping-cart" style="font-size: 48px; color: #ddd; margin-bottom: 20px;"></i>' +
            '  <p>Ihr Warenkorb ist leer.</p>' +
            '  <a href="index.html">Weiter einkaufen</a>' +
            '</div>';
          return;
        }

        var html = '';
        html += '<table class="sc-cart-table">';
        html += '  <thead><tr>' +
          '    <th>Produkt</th>' +
          '    <th>Bezeichnung</th>' +
          '    <th>Preis</th>' +
          '    <th>Menge</th>' +
          '    <th>Gesamt</th>' +
          '    <th></th>' +
          '  </tr></thead><tbody>';

        var subtotal = 0;
        var ids = Object.keys(cart);

        ids.forEach(function (id) {
          var item = cart[id];
          var lineTotal = item.price * item.qty;
          subtotal += lineTotal;

          var imageHtml = item.image
            ? '<img class="sc-img" src="' + item.image.replace(/\\/g, '/') + '" alt="' + escapeHtml(item.name) + '">'
            : '<div style="width:70px;height:70px;background:#eee;border-radius:3px;"></div>';

          html += '<tr data-id="' + id + '">';
          html += '  <td data-label="Produkt">' + imageHtml + '</td>';
          html += '  <td data-label="Bezeichnung"><span class="sc-prod-name">' + escapeHtml(item.name) + '</span></td>';
          html += '  <td data-label="Preis">' + formatPrice(item.price) + '</td>';
          html += '  <td data-label="Menge">' +
            '    <input type="number" class="sc-qty-input" value="' + item.qty + '" min="1" data-id="' + id + '">' +
            '    <button class="btn btn-primary sc-btn-update" data-id="' + id + '" style="margin-left:6px;">' +
            '      <i class="fa fa-refresh"></i>' +
            '    </button>' +
            '  </td>';
          html += '  <td data-label="Gesamt" class="sc-line-total">' + formatPrice(lineTotal) + '</td>';
          html += '  <td data-label="Aktion">' +
            '    <button class="sc-remove" data-id="' + id + '" title="Entfernen">&times;</button>' +
            '  </td>';
          html += '</tr>';
        });

        html += '</tbody></table>';

        // Totals
        var shipping = subtotal >= 150 ? 0 : 17;
        var total = subtotal + shipping;

        html += '<div class="sc-cart-totals">';
        html += '  <div class="sc-total-row">' +
          '    <span>Zwischensumme</span>' +
          '    <span>' + formatPrice(subtotal) + '</span>' +
          '  </div>';
        if (shipping > 0) {
          html += '  <div class="sc-total-row">' +
            '    <span>Versand (DPD/DHL)</span>' +
            '    <span>' + formatPrice(shipping) + '</span>' +
            '  </div>';
          html += '  <div class="sc-total-row" style="font-size:13px;color:#999;">' +
            '    <span>Versandkostenfrei ab 150 €</span>' +
            '    <span></span>' +
            '  </div>';
        } else {
          html += '  <div class="sc-total-row">' +
            '    <span>Versand</span>' +
            '    <span style="color:#4CAF50;font-weight:600;">Kostenlos</span>' +
            '  </div>';
        }
        html += '  <div class="sc-total-row sc-grand-total">' +
          '    <span>Gesamt</span>' +
          '    <span>' + formatPrice(total) + '</span>' +
          '  </div>';
        html += '</div>';

        // Actions
        html += '<div class="sc-cart-actions">';
        html += '  <a href="index.html" class="btn sc-btn-continue"><i class="fa fa-arrow-left"></i> Weiter einkaufen</a>';
        html += '  <div>';
        html += '    <button class="btn sc-btn-clear" id="sc-clear-cart">Warenkorb leeren</button>';
        html += '    <button class="btn sc-btn-checkout" id="sc-checkout-btn" style="margin-left:8px;">Zur Kasse <i class="fa fa-arrow-right"></i></button>';
        html += '  </div>';
        html += '</div>';

        container.innerHTML = html;

        // ── Event binding ──

        // Remove
        container.querySelectorAll('.sc-remove').forEach(function (btn) {
          btn.addEventListener('click', function () {
            Cart.remove(this.getAttribute('data-id'));
            renderCart();
          });
        });

        // Update qty
        container.querySelectorAll('.sc-btn-update').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = this.getAttribute('data-id');
            var input = container.querySelector('.sc-qty-input[data-id="' + id + '"]');
            var val = parseInt(input.value, 10) || 1;
            if (val < 1) val = 1;
            Cart.updateQty(id, val);
            renderCart();
          });
        });

        // Enter key on qty input
        container.querySelectorAll('.sc-qty-input').forEach(function (input) {
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              var id = this.getAttribute('data-id');
              var val = parseInt(this.value, 10) || 1;
              if (val < 1) val = 1;
              Cart.updateQty(id, val);
              renderCart();
            }
          });
        });

        // Clear
        var clearBtn = document.getElementById('sc-clear-cart');
        if (clearBtn) {
          clearBtn.addEventListener('click', function () {
            if (confirm('Warenkorb wirklich leeren?')) {
              Cart.clear();
              renderCart();
            }
          });
        }

        // Checkout
        var checkoutBtn = document.getElementById('sc-checkout-btn');
        if (checkoutBtn) {
          checkoutBtn.addEventListener('click', function () {
            alert('Kasse kommt demnächst! (Trocador-Integration)');
          });
        }
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str || ''));
        return div.innerHTML;
      }

      // Wait for Cart to be ready
      function waitForCart() {
        if (window.SteroidCart && typeof window.SteroidCart.getCart === 'function') {
          renderCart();
        } else {
          setTimeout(waitForCart, 100);
        }
      }

      // Initial render
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', waitForCart);
      } else {
        waitForCart();
      }
    })();
  </script>
